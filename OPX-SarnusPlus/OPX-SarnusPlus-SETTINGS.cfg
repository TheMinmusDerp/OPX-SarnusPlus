// Modify these settings to customize your game

@Kopernicus:BEFORE[OPX-JoolPlus]
{
    OPX_SarnusPlus_Settings
    {
        UseInnerPseudobodies = False // True or False, defaults to False
        UseOuterPseudobodies = False // True or False, defaults to False
        HaleRevamp = True // True or False, defaults to True
        OvokRevamp = True // True or False, defaults to True
        SensibleOvokSize = True // True or False, defaults to True
        TektoRevamp = True // True or False, defaults to True
        //UNIMPLEMENTED BrownTekto = True // True or False, defaults to False
        SarnusTextureChange = True // True or False, defaults to True
    }
}
//EXPLANATIONS
// UseInnerPseudobodies – adds the five inner pseudobodies to the system, as optional destinations to fill out the system's features. 
// UseOuterPseudobodies – adds Sarnus' collection of outer captured asteroids as optional destinations.
// They have no contract weight, and science values add up to a much smaller number of bodies to prevent oversaturation.
// HaleRevamp – new Hale textures applied
// OvokRevamp – new Ovok textures applied
// SensibleOvokSize – base OPM's Ovok is 26 km across despite ostensibly being a Methone analog. this makes that not the case.
// TektoRevamp – new Tekto textures applied
// UNIMPLEMENTED BrownTekto – new Tekto color map is closer in color to real life Titan if you want the realism. doesn't work right now
// SarnusTextureChange – changes Sarnus' surface textures
// future updates will add more
