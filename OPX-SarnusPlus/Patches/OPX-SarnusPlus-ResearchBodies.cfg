	{
		Sarnus = #LOC_OPX-SP_RB_Sarnus
		Vizak = #LOC_OPX-SP_RB_Vizak
		Ryla = #LOC_OPX-SP_RB_Ryla
		Hale = #LOC_OPX-SP_RB_Hale
		Masmar = #LOC_OPX-SP_RB_Masmar
		Ovok = #LOC_OPX-SP_RB_Ovok
		Encethys = #LOC_OPX-SP_RB_Encethys
		Eeloo = #LOC_OPX-SP_RB_Eeloo2
		Slate = #LOC_OPX-SP_RB_Slate
		Tekto = #LOC_OPX-SP_RB_Tekto
		Hypo = #LOC_OPX-SP_RB_Hypo
		Phabus = #LOC_OPX-SP_RB_Phabus
