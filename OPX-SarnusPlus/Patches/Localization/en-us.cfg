Localization
{
	en-us
	{
		// Sarnus
		#LOC_OPX-SP_Sarnus_Name = Sarnus^N
        #LOC_OPX-SP_Sarnus_Desc = Early astronomers believed Sarnus was in fact multiple planets, closely orbiting together. When they cleaned their telescopes, they realized that those extra planets were in fact thin rings orbiting Sarnus. Regular cleaning of telescope lenses became mandatory after that.
		#LOC_OPX-SP_Sarnus_Biome_PZ = Polar Zones
		#LOC_OPX-SP_Sarnus_Biome_TB = Temperate Belts
		#LOC_OPX-SP_Sarnus_Biome_TZ = Temperate Zones
		#LOC_OPX-SP_Sarnus_Biome_EZ = Equatorial Zone
		#LOC_OPX-SP_Sarnus_Biome_TrB = Tropical Bands
		#LOC_OPX-SP_Sarnus_Biome_TrZ = Tropical Zones
		#LOC_OPX-SP_Sarnus_Biome_S = Spots
        
        // Vizak
		#LOC_OPX-SP_Vizak_Name = Vizak^N
		#LOC_OPX-SP_Vizak_Desc = Vizak is a small moon orbiting within the rings of Sarnus, serving to keep the beautiful arrangement of particles and gaps in its shape. How do we know this thing is there? Uhhh... sh shu shut up
		#LOC_OPX-SP_Vizak_Biome_S = Surface
		#LOC_OPX-SP_Vizak_Biome_ER = Equatorial Ridge
		
		// Ryla
		#LOC_OPX-SP_Ryla_Name = Ryla^N
		#LOC_OPX-SP_Ryla_Desc = Along with Hale and Vizak, Ryla is a small moon which works to shepherd the particles of Sarnus' rings. It's orbit takes it very close to the outer edge of the system, but little else can be said about it until a visit is made.
		#LOC_OPX-SP_Ryla_Biome_P = Poles
		#LOC_OPX-SP_Ryla_Biome_TR = Temperate Regions
		#LOC_OPX-SP_Ryla_Biome_H = Highlands
		#LOC_OPX-SP_Ryla_Biome_IC = Impact Craters

        // Hale
        #LOC_OPX-SP_Hale_Name = Hale^N
        #LOC_OPX-SP_Hale_Desc = This small moonlet orbiting in the rings of Sarnus is named after Hale, a female shepherd from Kerbal mythology who saved the galaxy from certain destruction. Its location in Sarnus' rings results in some of the finest views in the Kerbol system.
        #LOC_OPX-SP_Hale_Biome_M = Macula
        #LOC_OPX-SP_Hale_Biome_AR = Amarius Region

		// Masmar
		#LOC_OPX-SP_Masmar_Name = Masmar
		#LOC_OPX-SP_Masmar_Desc = After countless hours of trying to remove a dirt speck from pictures of Sarnus, one plucky astronomer, since promoted to the test flight program, pointed out that it's probably a moon. Masmar's surface is inert and pockmarked, with a prominent equatorial crater clearly visible from afar as the moon's most important feature. It's definitely not anything else. Just a crater. Yessir. 
		#LOC_OPX-SP_Masmar_Biome_SC = Sovereign Crater
		#LOC_OPX-SP_Masmar_Biome_SCP = Sovereign Crater Peak
		#LOC_OPX-SP_Masmar_Biome_KC = Kessel Crater
		#LOC_OPX-SP_Masmar_Biome_KCR = Kessel Crater Rim
		#LOC_OPX-SP_Masmar_Biome_KCCP = Kessel Crater Central Pit
		#LOC_OPX-SP_Masmar_Biome_PB = Polar Basins
		#LOC_OPX-SP_Masmar_Biome_L = Lowlands
		#LOC_OPX-SP_Masmar_Biome_M = Midlands
		#LOC_OPX-SP_Masmar_Biome_H = Highlands

        // Ovok
		#LOC_OPX-SP_Ovok_Name = Ovok^N
        #LOC_OPX-SP_Ovok_Desc = Ovok's characteristic smooth egg shape is caused by the tidal force exerted by Sarnus and Ovok's gravity. This has led scientists to believe that the moon must consist of an icy fluff, that easily contracts and expands, resulting in a landscape that is free of deep impact craters. The moon was named for Ovok, a mythological beast known for its soft fur and razor-like claws.
        #LOC_OPX-SP_Ovok_Biome_MO = Macula Oblongata
        #LOC_OPX-SP_Ovok_Biome_TR = Tasi Region
		
		// Encethys
		#LOC_OPX-SP_Encethys_Name = Encethys
		#LOC_OPX-SP_Encethys_Desc = Discovered at the same time as Plock, the square heads in charge of cataloging the astronomical discoveries mixed up the records of two celestial bodies, leading to years of one being confused for the other. The surface of Encethys is very smooth and nearly devoid of large craters, which could be the result of cryovolcanic activity. This might mean that the moons harbors a liquid ocean beneath its frozen crust.
		#LOC_OPX-SP_Encethys_Biome_L = Lowlands
		#LOC_OPX-SP_Encethys_Biome_M = Midlands
		#LOC_OPX-SP_Encethys_Biome_H = Highlands
		#LOC_OPX-SP_Encethys_Biome_LC = Lonely Crater
		#LOC_OPX-SP_Encethys_Biome_LCP = Lonely Crater Peaks
		#LOC_OPX-SP_Encethys_Biome_C = Crevasses
		
		// Eeloo
		#LOC_OPX-SP_Eeloo_Desc = The third major moon of Sarnus, Eeloo is a fairly standard ball of rock and ice, its surface cracked by tidal interactions between Sarnus and its sister moon of Slate. While once theorized to have a subglacial ocean, scientists now agree that this makes more sense for Encethys, leaving Eeloo to be much more boring than it was initially thought to be.

		// Tekto
		#LOC_OPX-SP_Tekto_Name = Tekto^N
		#LOC_OPX-SP_Tekto_Desc = This moon has a very dense atmosphere for a body its size. Combined with the low gravity, this means that a Kerbal with wings attached to his arms could lift off from the surface of the moon under his or her own power. Those wings would have to be made of some sturdy materials though, as Tekto's atmosphere appears to be very violent.
		#LOC_OPX-SP_Tekto_Biome_PR = Polar Regions
		#LOC_OPX-SP_Tekto_Biome_MA = Mount Avaritia
		#LOC_OPX-SP_Tekto_Biome_TL = Twin Lakes
		#LOC_OPX-SP_Tekto_Biome_SoIs = Southern Islands
		#LOC_OPX-SP_Tekto_Biome_BI = Belial Island
		#LOC_OPX-SP_Tekto_Biome_RI = Rhat Island
		#LOC_OPX-SP_Tekto_Biome_MP = Malebolge Peninsula
		#LOC_OPX-SP_Tekto_Biome_WP = Witvoogd Peninsula
		#LOC_OPX-SP_Tekto_Biome_SIs = Sarbian Islands
		#LOC_OPX-SP_Tekto_Biome_ML = Medikohl Lake
		#LOC_OPX-SP_Tekto_Biome_AS = Antenor Sea
		#LOC_OPX-SP_Tekto_Biome_VL = Vexxus Lake
		#LOC_OPX-SP_Tekto_Biome_SI = Sylandro Island
		#LOC_OPX-SP_Tekto_Biome_SS = Silisko Sea
		#LOC_OPX-SP_Tekto_Biome_IL = Inland Lagoons
		#LOC_OPX-SP_Tekto_Biome_R = Rivers
		#LOC_OPX-SP_Tekto_Biome_Mt = Mountains
		#LOC_OPX-SP_Tekto_Biome_ED = Equatorial Dunes
		#LOC_OPX-SP_Tekto_Biome_L = Lowlands
		#LOC_OPX-SP_Tekto_Biome_M = Midlands
		#LOC_OPX-SP_Tekto_Biome_H = Highlands
		
		// Hypo
		#LOC_OPX-SP_Hypo_Name = Hypo
		#LOC_OPX-SP_Hypo_Desc = While from a distance it appears to be a fairly standard asteroid moon, Hypo is distinguished from the rabble by its chaotic rotation, extremely low density, and sponge-like appearance. Hypo was the first non-rounded moon to be discovered by Kerbal scientists, and therefore took the name of the Kerbal god of the watchmen. Its surface is predicted to be extremely rugged and difficult to traverse, so be careful when attempting to do so. 
		#LOC_OPX-SP_Hypo_Biome_P = Pits
		#LOC_OPX-SP_Hypo_Biome_H = Highlands
		#LOC_OPX-SP_Hypo_Biome_L = Lowlands
		
		// Phabus
		#LOC_OPX-SP_Phabus_Name = Phabus
		#LOC_OPX-SP_Phabus_Desc = Phabus is the outermost moon of Sarnus, orbiting in a somewhat elliptical, retrograde orbit far beyond even Hypo. Its dark surface holds many secrets about the past of the Kerbol System. More esoterically, the home of the gods in ancient Kerbal mythology was described as floating high above the farthest planet, then considered to be Sarnus. Some crackheads continue to believe in such myths, and consider Phabus to be the site of this mythic structure.
		#LOC_OPX-SP_Phabus_Biome_IC = Impact Craters
		#LOC_OPX-SP_Phabus_Biome_L = Lowlands
		#LOC_OPX-SP_Phabus_Biome_M = Midlands
		#LOC_OPX-SP_Phabus_Biome_S = Slopes
		#LOC_OPX-SP_Phabus_Biome_H = Highlands
		#LOC_OPX-SP_Phabus_Biome_P = Peaks
		
		// Surface biome of all pseudobodies
		#LOC_OPX-SP_Common_Biome_S = Surface

		// Nofla
		#LOC_OPX-SP_Nofla_Name = I1-Nofla^N
		#LOC_OPX-SP_Nofla_Desc = Nofla is a highly elongated inner moon of Sarnus in close proximity to the thin F ring. Likely a porous, icy body, Nofla has a very high albedo compared to some of its neighbors in the Sarnus system. 

		// Gibb
		#LOC_OPX-SP_Gibb_Name = I2-Gibb^N
		#LOC_OPX-SP_Gibb_Desc = An inner moon of Sarnus, Gibb exists in a constant gravitational dance with its larger companion Hale. Or at least it would be, if gravity affected things that aren't our spaceships. 
		
		// Egin
		#LOC_OPX-SP_Egin_Name = I3-Egin^N
		#LOC_OPX-SP_Egin_Desc = Egin is a very small object orbiting within the so-called Egin ring, formed by dust blasted off its surface by micrometeoroid impacts. This ring is very sparse, and is generally only visible backlit.
		
		// Palar
		#LOC_OPX-SP_Palar_Name = I4-Palar^N
		#LOC_OPX-SP_Palar_Desc = Ovok's little cousin. This small moon is similar in characteristics to Ovok, and orbits in a similar position. I'm not sure if the KSC knows anything else about it.
		
  		// Seri
        #LOC_OPX-SP_Seri_Name = I5-Seri^N
        #LOC_OPX-SP_Seri_Desc = One of the few trojan moons in the Kerbol System, Seri is a miniscule rock held in orbit by the balanced gravities of Slate and Sarnus. Seri's tiny size means that it could serve as a good refueling site for missions into Slate's deep gravity well.

		// Qalbos
		#LOC_OPX-SP_Qalbos_Name = K1-Qalbos^N
		#LOC_OPX-SP_Qalbos_Desc = After Phabus, Qalbos is the largest of Sarnus' flock of captured outer moons. A pale red in color, it shares a similar spectra with many other objects in the Kanuk group, demonstrating that they may share a common origin, after the breakup of a larger object in the distant past. Qalbos is also the largest object in the subgroup of the Kanuk moons that bears its name. 

		// Ixon
		#LOC_OPX-SP_Ixon_Name = K2-Ixon^N
		#LOC_OPX-SP_Ixon_Desc = By far the largest member of the moon group which bears its name, Ixon is yet another fragment of a distant past asteroid breakup. Interestingly, the Ixori moon group is not centered on Ixon's orbit, with every other known example orbiting at a greater distance from Sarnus. This group is completely distinct from the Kanuk group, but is sometimes sorted with those moons for convenience.

		// Qorinap
		#LOC_OPX-SP_Qorinap_Name = K3-Qorinap^N
		#LOC_OPX-SP_Qorinap_Desc = While most of the Kanuk outer moon group exists in one of two fairly tightly packed subgroups, Qorinap is unique in that its orbit places it in almost complete isolation on the fancy orbit graph, roughly equidistant between the two subgroups. It's feeling lonely! You should go visit it.

		// Quvak
		#LOC_OPX-SP_Quvak_Name = K4-Quvak^N
		#LOC_OPX-SP_Quvak_Desc = Kuvaq is one of the closest of Sarnus' irregular satellites, orbiting below even Phabus. It is believed to exist in a Kozai resonance, causing its eccentricity and inclination to cyclically go up and down over long periods of time. In its current position, it may impact Phabus sometime soon. 
		
		// Yalor
		#LOC_OPX-SP_Yalor_Name = Y1-Yalor^N
		#LOC_OPX-SP_Yalor_Desc = Taking over three Kerbin years to make an orbit around Sarnus, Yalor is among the more remote destinations in this system. It is the second largest retrograde moon after Phabus, and the fifth largest irregular moon overall. 

		// Saith
		#LOC_OPX-SP_Saith_Name = Y2-Saith^N
		#LOC_OPX-SP_Saith_Desc = One of many irregular satellites high above Sarnus, Saith is a small rock only discovered relatively recently. Like most things of this nature, its origins are an open question, with barfights breaking out regularly over whether it is an independently captured asteroid or a fragment of Phabus. 

		// Oran
		#LOC_OPX-SP_Oran_Name = Y3-Oran^N
		#LOC_OPX-SP_Oran_Desc = A small, irregularly shaped moon following a highly eccentric retrograde orbit. Probably not native to the region. Could be fun, though.

		// Research Bodies
		#LOC_OPX-SP_RB_Sarnus = Before we knew Jool existed we had always known that there was something greater in the sky. Large and graceful, caretaker of at least as many interesting minor bodies. Now that we have the technology, all is made clear... Sarnus, the timeless.
		#LOC_OPX-SP_RB_Vizak = ITS A UFO! WE'RE UNDER ATTACK! What's that? Moon? Sarnus is right there? Oh. Uhhh. I'll call it... Vizak. Yes. Definitely not a keysmash.
		#LOC_OPX-SP_RB_Ryla = Stop putting lentils in front of my telescope.
		#LOC_OPX-SP_RB_Hale = Hidden in Sarnus' majestic rings we've discovered a very small moon. Since it shepherds the rings around it, we should name it after the mythological shepherd Hale.
		#LOC_OPX-SP_RB_Masmar = This little guy Masmar, whizzing around beyond Sarnus' rings must have suffered a beating in its youth, with that giant crater.
		#LOC_OPX-SP_RB_Ovok = At the outer edge of Sarnus' rings we see a small moon with an unusual shape. It is only fitting that we name it after Ovok, the beast that guarded the gates of the Underworld of the old myths.
		#LOC_OPX-SP_RB_Encethys = This thing is way too bright. Our telescopes are failing to pick out any detail on its surface. Definitely made of ice, though.
		#LOC_OPX-SP_RB_Eeloo2 = At first it look like this dot was a planet beyond Sarnus' orbit. On closer inspection it turns out to be a moon of Sarnus. Eeloo sounds like a good name for it.
		#LOC_OPX-SP_RB_Slate = A large moon orbiting Sarnus was spotted on our telescopes. Dark areas are visible on the satellite that remind you of the color of Slate. Yeah, Slate will be a good name for this moon.
		#LOC_OPX-SP_RB_Tekto = After thinking for some while that there was a booger on the telescope, we realized it was actually a moon orbiting Sarnus.
		#LOC_OPX-SP_RB_Hypo = Who put this pumice stone in space? I don't think that's where it goes. 
		#LOC_OPX-SP_RB_Phabus = Wow, I'm lucky I found this thing! It really is way out there from the rest of the moon system, I sure hope there isn't anything related to an alien molecule. 
		#LOC_OPX-SP_RB_Nofla = Space penguin? Space penguin. Meet Nofla.
		#LOC_OPX-SP_RB_Gibb = Gibb appears to be in some sort of gravitational relationship with its larger companion, Hale.
		#LOC_OPX-SP_RB_Egin = The jury is out on whether Egin is a real thing or a smudge on the lens.
		#LOC_OPX-SP_RB_Palar = Palar seems to be Ovok if it was marginally smaller. Nice to know that Ovok's weird shape wasn't a fluke, I guess. 
		#LOC_OPX-SP_RB_Seri = Slate is so huge, it captures objects in other parts of its orbit, like Seri here. 
		#LOC_OPX-SP_RB_OuterPseudobodies = For a while there it was even odds whether this thing was a background star, an asteroid, or a distant moon.
		
		// Tarsier Tech
		#LOC_OPX-SP_TT_Sarnus = A gas giant. The rings around it are beautiful.
		#LOC_OPX-SP_TT_Hale = This tiny moon is so hard to see through Sarnus' rings, but it must be responsible for keeping the rings in place.
		#LOC_OPX-SP_TT_Vizak = I think this is a burger... in SPACE!
		#LOC_OPX-SP_TT_Ryla = Please stop putting lentils in front of my camera.
		#LOC_OPX-SP_TT_Masmar = Wow, that's one hell of a crater.
		#LOC_OPX-SP_TT_Ovok = It looks like a giant egg. Could it be an unhatched space kraken?
		#LOC_OPX-SP_TT_Encethys = I still can't find any detail on this thing's surface.
		#LOC_OPX-SP_TT_Eeloo = Still giving dwarf planet vibes. I dunno why though.
		#LOC_OPX-SP_TT_Slate = This planet has no right being out here. I can see mountains and river valleys and mid-ocean ridges. What happened here?
		#LOC_OPX-SP_TT_Tekto = There is a very thick atmosphere, possibly liquids on the surface. The possibilities here are beyond imagination.
		#LOC_OPX-SP_TT_Hypo = Still do not know why this pumice stone is out here.
		#LOC_OPX-SP_TT_Phabus = Perfectly ordinary asteroid... yessir. Nothing amiss. 
		
	}
}
